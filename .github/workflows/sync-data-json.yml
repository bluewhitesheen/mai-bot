name: Sync data.json via PR

on:
  schedule:
    # 台北 12:00, 00:00 (UTC 04:00, 16:00)
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-data-json
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and compare data.json
        id: diff
        run: |
          set -euo pipefail

          REMOTE_URL="https://dp4p6x0xfi5o9.cloudfront.net/maimai/data.json"
          curl -fsSL "$REMOTE_URL" -o /tmp/remote.json

          jq -S . /tmp/remote.json > /tmp/remote.norm.json
          jq -S . data.json > /tmp/local.norm.json

          if cmp -s /tmp/local.norm.json /tmp/remote.norm.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/remote.json data.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-data-json
          title: "chore: sync data.json"
          commit-message: "chore: sync data.json from CDN"
          body: |
            Auto-sync data.json from:
            https://dp4p6x0xfi5o9.cloudfront.net/maimai/data.json

            This PR is generated by GitHub Actions when remote data.json is different from repo.
          add-paths: |
            data.json
          labels: |
            chore
            data-sync
