name: Auto merge data.json sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-data-json
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Validate PR source
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ "$BASE_REPO" != "$HEAD_REPO" ]; then
            echo "PR comes from a fork."
            exit 1
          fi

          if [ "$BASE_BRANCH" != "main" ]; then
            echo "PR does not target main."
            exit 1
          fi

          if [ "$HEAD_BRANCH" != "chore/sync-data-json" ]; then
            echo "Unexpected head branch."
            exit 1
          fi

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          if [ "${#changed_files[@]}" -ne 1 ] || \
              [ "${changed_files[0]}" != "data.json" ]; then
            echo "PR must contain only data.json."
            exit 1
          fi

      - name: Check updateTime
        run: |
          set -euo pipefail

          update_time=$(jq -r '.updateTime // empty' data.json)

          echo "updateTime: $update_time"

          if [[ ! "$update_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]; then
            echo "Invalid updateTime format."
            exit 1
          fi
      
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MAI_BOT_APP_ID }}
          private-key: ${{ secrets.MAI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mai-bot

      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash