name: Deploy mai-bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check and update repository
        id: check
        env:
          REPO_DIR: /home/terry/mai-bot
        run: |
          set -euo pipefail

          cd "$REPO_DIR"

          echo "Checking local repository..."

          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean."
            git status --short
            exit 1
          fi

          OLD_SHA=$(git rev-parse HEAD)

          echo "Old SHA: $OLD_SHA"

          echo "Fetching main..."
          git fetch origin main

          NEW_SHA=$(git rev-parse origin/main)

          echo "New SHA: $NEW_SHA"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "Already up to date."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking changed files..."

          mapfile -t changed_files < <(
            git diff --name-only "$OLD_SHA" "$NEW_SHA"
          )

          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          if [ "${#changed_files[@]}" -eq 1 ] && \
              [ "${changed_files[0]}" = "data.json" ]; then
            echo "Only data.json changed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes are not deployment-triggering."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating local repository..."
          git pull --ff-only origin main

      - name: Restart with new data.json
        if: steps.check.outputs.deploy == 'true'
        env:
          REPO_DIR: /home/terry/mai-bot
        run: |
          set -euo pipefail

          cd "$REPO_DIR"

          # data.json is bind-mounted, so recreating the container is enough
          echo "Recreating containers..."
          docker compose up -d --force-recreate

          echo "Deployment completed."